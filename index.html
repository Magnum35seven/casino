<html lang="en"><head><meta charset="utf-8">

<title>Arcane Quest</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
:root{--c:min(calc((100vw - 70px)/5),86px);--gold:#f6c64a;--gold2:#a8741a}
html,body{margin:0;height:100%;overflow:hidden;color:#fff;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;background:radial-gradient(120% 70% at 50% 0,#27338a,#0d1033 52%,#04050f)}
#app{max-width:520px;height:100dvh;margin:auto;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}
.marq{position:relative;width:100%;padding:14px 0 8px;border-radius:18px;text-align:center;background:linear-gradient(#2c2468,#120c33);box-shadow:0 0 0 3px var(--gold2),0 0 0 5px #fff4,0 10px 30px #000a}
.marq:before,.marq:after{content:"";position:absolute;left:10px;right:10px;top:3px;height:8px;background:radial-gradient(circle,#fff 0 1.5px,#7ef3ff 2.5px,#0000 4px) 0 0/16px 8px;animation:chase 1s steps(1) infinite}
.marq:after{background-position:8px 0;animation-delay:.5s}
@keyframes chase{50%{opacity:.15}}
h1{margin:0;font:900 italic 27px/1 "Palatino Linotype","Book Antiqua",Georgia,serif;letter-spacing:1px;background:linear-gradient(#fff6c8,#f6c64a 45%,#a8741a 55%,#ffe27a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #4b2c03) drop-shadow(0 0 10px #f6c64a88)}
.jp{margin:6px auto 0;width:78%;background:#000;border-radius:10px;padding:3px;box-shadow:inset 0 0 10px #000,0 0 0 1px var(--gold2)}
.jp small{display:block;font-size:10px;color:#ffd36a;letter-spacing:2px}
.jp b{font:700 24px "Courier New",monospace;color:#ffd36a;text-shadow:0 0 10px #fa0}
#snd{position:absolute;right:10px;top:16px;background:none;border:0;font-size:18px;color:#fff}
.frame{position:relative;padding:10px;border-radius:22px;background:linear-gradient(145deg,#fff2b0,#c8921f 30%,#6b430a 55%,#e8b83e 80%,#fff2b0);box-shadow:0 0 0 2px #3b2405,0 12px 40px #000c,0 0 40px #f6c64a44;transition:box-shadow .4s}
body.fs .frame{box-shadow:0 0 0 2px #3b2405,0 0 60px #b45cff,0 0 120px #7a2cff88}
.win{position:relative;display:grid;grid-template-columns:repeat(5,var(--c));gap:3px;padding:3px;border-radius:14px;background:#000;overflow:hidden}
.win:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,#fff0 35%,#fff3 42%,#fff0 50%) -120% 0/250% 100% no-repeat;animation:sheen 5s infinite}
@keyframes sheen{to{background-position:120% 0}}
.reel{height:calc(var(--c)*3);overflow:hidden;position:relative;border-radius:6px;background:radial-gradient(120% 90% at 50% 40%,#4a3fb0,#1f1858 60%,#0b0a2b)}
.reel:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(#000c,#0000 24%,#0000 76%,#000c)}
.reel.ant{box-shadow:0 0 0 3px #ffe27a,0 0 25px 6px #ffb300;z-index:2;animation:ant .25s infinite alternate}
@keyframes ant{to{box-shadow:0 0 0 3px #fff,0 0 40px 12px #ff7a00}}
.strip{will-change:transform}.reel.spin .strip{filter:blur(2.5px)}
.sym{height:var(--c);display:grid;place-items:center;font-size:calc(var(--c)*.58);line-height:1;transition:opacity .3s}
.sym.dim{opacity:.3}.sym.hit{background:radial-gradient(#ffd24daa,#0000 72%);animation:hit .5s infinite alternate}
@keyframes hit{to{transform:scale(1.14);filter:drop-shadow(0 0 6px #ffb300)}}
.s7{font:900 calc(var(--c)*.8)/1 Georgia,serif;color:transparent;background:linear-gradient(#ff8a8a,#e0102f 45%,#7d0018);-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:2px #d9a21f;filter:drop-shadow(0 2px 2px #0009)}
.wd{width:72%;aspect-ratio:1;display:grid;place-items:center;border-radius:50%;font-size:calc(var(--c)*.46);color:#ffe27a;background:radial-gradient(circle at 35% 25%,#c58bff,#6d28d9 60%,#2e0f6b);box-shadow:0 0 0 2px #ffe27a,0 3px 6px #0009}
#msg{min-height:20px;font-size:14px;color:#ffe9a8;text-align:center;text-shadow:0 0 8px #000}
.panel{width:100%;padding:10px;border-radius:20px;background:linear-gradient(#2a2160,#0f0a2c);box-shadow:inset 0 1px #fff3,0 0 0 2px var(--gold2),0 8px 24px #000a}
.stats{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:6px}
.stat{background:#000;border-radius:10px;padding:4px 6px;text-align:center;box-shadow:inset 0 0 8px #000,0 0 0 1px #6b430a}
.stat small{display:block;font-size:10px;color:#e8c36a}.stat b{font:700 18px "Courier New",monospace;color:#8dff9f;text-shadow:0 0 8px #3f9}
.ctl{display:grid;grid-template-columns:1fr 104px 1fr;gap:8px;align-items:center;margin-top:10px}
.col{display:grid;gap:8px}.bb{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:0;border-radius:12px;padding:11px 4px;font:700 13px "Trebuchet MS",sans-serif;color:#2a1700;background:linear-gradient(#ffe59a,#e0a92f 55%,#a8741a);box-shadow:0 3px 0 #5b3a05,inset 0 1px #fff9}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #5b3a05}.btn.on{background:linear-gradient(#b4ffc2,#2fc65a 60%,#157a35)}
#spin{position:relative;width:100px;height:100px;border-radius:50%;border:0;color:#fff;font:900 20px Georgia,serif;letter-spacing:1px;text-shadow:0 2px 3px #0008;background:radial-gradient(circle at 35% 25%,#b9fff0,#19c3a3 38%,#07594d 85%);box-shadow:0 0 0 4px #f6c64a,0 0 0 7px #6b430a,0 8px 0 7px #032c26,0 14px 24px #000c,inset 0 -8px 14px #0006;animation:idle 1.6s infinite}
#spin:before{content:"";position:absolute;left:16%;top:7%;width:68%;height:38%;border-radius:50%;background:linear-gradient(#fffc,#fff0)}
#spin:active{transform:translateY(5px);box-shadow:0 0 0 4px #f6c64a,0 0 0 7px #6b430a,0 3px 0 7px #032c26,0 6px 12px #000c,inset 0 -8px 14px #0006}
#spin.busy{animation:none;filter:saturate(.7)}
@keyframes idle{50%{filter:brightness(1.25) drop-shadow(0 0 14px #3dffd8)}}
#fsb{position:absolute;left:50%;top:-13px;transform:translateX(-50%);padding:3px 14px;border-radius:12px;font:700 13px sans-serif;background:linear-gradient(#c58bff,#5b21b6);box-shadow:0 0 0 2px #ffe27a;display:none;white-space:nowrap;z-index:3}
body.fs #fsb{display:block}
#foot{font-size:11px;color:#b99;text-align:center;padding:2px 0 6px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:20}
#ov{position:fixed;inset:0;z-index:30;display:none;place-items:center;align-content:center;gap:18px;text-align:center;background:#000b;backdrop-filter:blur(3px);padding:20px}
#ov.on{display:grid}
#ov .bt{font:900 italic 46px Georgia,serif;background:linear-gradient(#fff6c8,#f6c64a 45%,#a8741a 55%,#ffe27a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px #f6c64a);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
#ov .bn{font:700 44px "Courier New",monospace;color:#8dff9f;text-shadow:0 0 16px #3f9}#ov p{margin:0;font-size:17px;color:#ffe9a8}
#ov .btn{padding:14px 34px;font-size:17px}
@keyframes pop{from{transform:scale(.3);opacity:0}}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(1.5px 1.5px at 12% 18%,#fff,#0000),radial-gradient(1px 1px at 78% 12%,#bfe,#0000),radial-gradient(1.5px 1.5px at 90% 55%,#fff,#0000),radial-gradient(1px 1px at 25% 70%,#fff,#0000),radial-gradient(1.5px 1.5px at 60% 85%,#cff,#0000),radial-gradient(1px 1px at 40% 40%,#fff,#0000);animation:tw 4s infinite alternate}
@keyframes tw{to{opacity:.35}}
.sym svg{width:86%;height:86%;filter:drop-shadow(0 3px 4px #000a)}.sym.hit svg{filter:drop-shadow(0 0 8px #ffd36a)}
#lsv{position:absolute;left:3px;top:3px;width:calc(100% - 6px);height:calc(100% - 6px);pointer-events:none;z-index:3;filter:drop-shadow(0 0 3px #000)}
.stps{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.stp{display:grid;grid-template-columns:34px 1fr 34px;gap:4px;align-items:center;background:#000;border-radius:10px;padding:3px;text-align:center;box-shadow:inset 0 0 8px #000,0 0 0 1px #6b430a}
.stp small{display:block;font-size:10px;color:#e8c36a}.stp b{font:700 16px "Courier New",monospace;color:#7ef3ff}.btn.sm{padding:6px 0;font-size:16px}
#mtr{display:flex;align-items:center;justify-content:center;gap:5px;min-height:18px}
#mtr small{margin-left:6px;font:700 12px "Courier New",monospace;color:#7ef3ff}
.pip{width:11px;height:11px;transform:rotate(45deg);background:#1b1650;border:1px solid #6b430a;transition:.3s}
.pip.on{background:linear-gradient(#e8ffff,#5aa8ff);border-color:#9fe8ff;box-shadow:0 0 8px #7ef3ff}
#bg{position:absolute;left:3px;top:3px;width:calc(100% - 6px);height:calc(100% - 6px);display:none;grid-template:repeat(3,1fr)/repeat(5,1fr);gap:3px;z-index:4;background:#05041a;border-radius:10px}
body.bonus #bg{display:grid}body.bonus .frame{box-shadow:0 0 0 2px #3b2405,0 0 60px #3dffd8,0 0 120px #19c3a388}
.bc{position:relative;overflow:hidden;border-radius:6px;background:radial-gradient(#2a2380,#0b0a2b);box-shadow:inset 0 0 12px #000}
.bc.lk{background:radial-gradient(circle,#5a4fd0,#1f1858);box-shadow:inset 0 0 0 2px #7ef3ff,0 0 10px #3dffd8;animation:lk .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes lk{from{transform:scale(.4)}}
.bc .gem{display:grid;place-items:center;height:100%}.bc .gem svg{width:78%;height:78%;margin-top:-10%;filter:drop-shadow(0 0 8px #7ef3ff)}
.bc .pv{position:absolute;left:0;right:0;bottom:6%;text-align:center;font:900 calc(var(--c)*.25) "Courier New",monospace;color:#fff;text-shadow:0 0 4px #000,0 0 6px #000,0 0 8px #3dffd8}
.bc.sp .rl{animation:rl .4s linear infinite;filter:blur(2px)}
@keyframes rl{to{transform:translateY(-50%)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>

 <div id="foot"></div>

<script>
const $=s=>document.querySelector(s),fmt=n=>Math.round(n).toLocaleString();
const SYM={drag:'<svg viewBox="0 0 64 64"><path d="M32 4C46 14 54 30 54 40a22 22 0 0 1-44 0C10 30 18 14 32 4Z" fill="url(#gd)" stroke="#ffd36a" stroke-width="2.5"/><path d="M18 36q7 6 14 0q7 6 14 0M20 46q6 6 12 0q6 6 12 0M24 26q8 6 16 0" fill="none" stroke="#ffb066" stroke-opacity=".6" stroke-width="2"/><path d="M30 12l4 10-5 6 6 8" stroke="#ffe27a" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>',orb:'<svg viewBox="0 0 64 64"><circle cx="32" cy="28" r="22" fill="url(#go)" stroke="#9fe8ff" stroke-width="2"/><path d="M18 30q8-12 20-6t8 14" stroke="#fff" stroke-opacity=".5" fill="none" stroke-width="2.5"/><ellipse cx="24" cy="18" rx="7" ry="4" fill="#fff" fill-opacity=".6" transform="rotate(-30 24 18)"/><path d="M16 52q16-10 32 0l-4 8H20Z" fill="url(#gg)" stroke="#6b430a" stroke-width="1.5"/></svg>',sword:'<svg viewBox="0 0 64 64"><path d="M32 2l6 9v29H26V11Z" fill="url(#gs)" stroke="#e8f4ff" stroke-width="1.5"/><path d="M32 6v32" stroke="#7488b0" stroke-width="2"/><path d="M14 40h36l-4 6H18Z" fill="url(#gg)" stroke="#6b430a" stroke-width="1.5"/><rect x="29" y="46" width="6" height="10" fill="url(#gb)"/><circle cx="32" cy="59" r="4" fill="url(#gg)"/><circle cx="32" cy="43" r="2.5" fill="#ff4a6e"/></svg>',potion:'<svg viewBox="0 0 64 64"><rect x="26" y="4" width="12" height="8" rx="2" fill="url(#gb)"/><path d="M27 12h10v12l15 26a7 7 0 0 1-6 11H18a7 7 0 0 1-6-11l15-26Z" fill="#cfeaff" fill-opacity=".25" stroke="#bfe6ff" stroke-width="2.5"/><path d="M20 40h24l8 14a7 7 0 0 1-6 7H18a7 7 0 0 1-6-7Z" fill="url(#ge)"/><circle cx="28" cy="50" r="2.5" fill="#fff" fill-opacity=".7"/><circle cx="37" cy="46" r="1.8" fill="#fff" fill-opacity=".7"/></svg>',book:'<svg viewBox="0 0 64 64"><rect x="12" y="6" width="40" height="52" rx="4" fill="url(#gp)" stroke="#ffd36a" stroke-width="2.5"/><path d="M52 10v44" stroke="#f3e7c0" stroke-width="3"/><path d="M32 16l3 7 7.5.7-5.6 5 1.7 7.4-6.6-3.9-6.6 3.9 1.7-7.4-5.6-5 7.5-.7Z" fill="url(#gg)"/><path d="M12 12h6M12 52h6" stroke="#ffd36a" stroke-width="3"/></svg>',rune:'<svg viewBox="0 0 64 64"><path d="M32 4l22 12v32L32 60 10 48V16Z" fill="url(#gk)" stroke="#9fb4d8" stroke-width="2.5"/><path d="M26 18v28M26 24l14 8-14 8" stroke="#7ef3ff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" style="filter:drop-shadow(0 0 5px #3df)"/></svg>',wild:'<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="url(#gw)"/><path d="M32 4l15 38H17Z" fill="url(#gp)" stroke="#ffd36a" stroke-width="2"/><ellipse cx="32" cy="44" rx="25" ry="7" fill="#3b1a7a" stroke="#ffd36a" stroke-width="2"/><path d="M19 38q13 5 26 0v4q-13 5-26 0Z" fill="url(#gg)"/><path d="M32 14l2.4 5 5.4.6-4 3.8 1 5.4-4.8-2.7-4.8 2.7 1-5.4-4-3.8 5.4-.6Z" fill="url(#gg)"/><text x="32" y="61" font-size="11" font-weight="900" text-anchor="middle" fill="#ffe27a" stroke="#2a1060" stroke-width="3" paint-order="stroke" font-family="Georgia,serif">WILD</text></svg>',gem:'<svg viewBox="0 0 64 64"><path d="M32 4l20 14-8 38H20L12 18Z" fill="url(#go)" stroke="#9fe8ff" stroke-width="2"/><path d="M12 18h40M32 4l-8 14 8 38 8-38Z" fill="none" stroke="#e8ffff" stroke-opacity=".6" stroke-width="1.5"/></svg>',scat:'<svg viewBox="0 0 64 64"><path d="M32 0l5 14H27ZM8 10l13 8-4 4ZM56 10L43 18l4 4Z" fill="#ffe27a" fill-opacity=".85"/><path d="M8 30a24 14 0 0 1 48 0Z" fill="url(#gb)" stroke="#ffd36a" stroke-width="2.5"/><rect x="8" y="30" width="48" height="22" rx="3" fill="url(#gb)" stroke="#ffd36a" stroke-width="2.5"/><path d="M8 38h48" stroke="#ffd36a" stroke-width="3"/><rect x="27" y="33" width="10" height="12" rx="2" fill="url(#gg)" stroke="#6b430a"/><text x="32" y="62" font-size="10" font-weight="900" text-anchor="middle" fill="#ffe27a" stroke="#2a1060" stroke-width="3" paint-order="stroke" font-family="Georgia,serif">BONUS</text></svg>'};

function pick(r){let L=Object.keys(WT).filter(k=>k!=='wild'||(r>0&&r<4)),t=L.reduce((a,k)=>a+WT[k],0),x=Math.random()*t;for(const k of L){if((x-=WT[k])<0)return k}return'rune'}

const allL=()=>[...Array(st.lines).keys()];
/* ---- sound ---- */
let AC;function snd(f,d=.1,t='sine',v=.12,at=0,f2){if(mute)return;try{AC=AC||new(window.AudioContext||webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+at;o.type=t;o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}
const jingle=n=>[523,659,784,1047,1319,1568].slice(0,n).forEach((f,i)=>snd(f,.22,'triangle',.14,i*.09));
const buzz=p=>navigator.vibrate&&navigator.vibrate(p);
/* ---- ui ---- */
function sync(){meter();$('#bal').textContent=fmt(st.bal);$('#bet').textContent=fmt(BETS[st.bi]*st.lines);$('#pl').textContent=BETS[st.bi];$('#ln').textContent=st.lines;$('#jp').textContent=fmt(st.jp);
 const s=$('#spin');s.textContent=busy?'STOP':fs?'FREE':'SPIN';s.classList.toggle('busy',busy);$('#auto').classList.toggle('on',auto);$('#turbo').classList.toggle('on',turbo);
 $('#fsb').textContent=`FREE SPINS ${fs} · WINS ×2`;document.body.classList.toggle('fs',fs>0);$('#snd').textContent=mute?'🔇':'🔊';save()}
function foot(){const m=Math.floor((Date.now()-t0)/60000),n=st.bal-bal0;$('#foot').textContent=`Play money only · Session ${m} min · Net ${n>=0?'+':'−'}${fmt(Math.abs(n))}`}
setInterval(foot,15000);
function roll(el,to,ms,tick){const s=performance.now();(function f(n){const p=Math.min(1,(n-s)/ms);el.textContent=fmt(to*(1-Math.pow(1-p,3)));if(tick&&p<1&&Math.random()<.3)snd(1200+Math.random()*600,.04,'square',.04);if(p<1)requestAnimationFrame(f)})(s)}
function ov(h,b,t){return new Promise(res=>{const o=$('#ov');o.innerHTML=h+(b?`<button class="btn" id="ok">${b}</button>`:'');o.classList.add('on');const c=()=>{o.classList.remove('on');res()};o.onclick=e=>{if(t||e.target.id==='ok')c()};if(t)setTimeout(c,t)})}
/* ---- coin fx ---- */
const cv=$('#fx'),cx=cv.getContext('2d');let P=[],raf=0;
function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener('resize',size);
function coins(n,big){for(let i=0;i<n;i++)P.push({x:big?Math.random()*cv.width:cv.width/2+(Math.random()-.5)*120,y:big?-20-Math.random()*200:cv.height*.45,vx:(Math.random()-.5)*(big?3:9),vy:big?2+Math.random()*3:-6-Math.random()*8,a:Math.random()*6,r:7+Math.random()*7});if(!raf)raf=requestAnimationFrame(loop)}
function loop(){cx.clearRect(0,0,cv.width,cv.height);P=P.filter(p=>p.y<cv.height+30);for(const p of P){p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.25;const w=Math.abs(Math.cos(p.a))*p.r+1;cx.beginPath();cx.ellipse(p.x,p.y,w,p.r,0,0,6.3);cx.fillStyle='#f6c64a';cx.fill();cx.lineWidth=2;cx.strokeStyle='#a8741a';cx.stroke()}raf=P.length?requestAnimationFrame(loop):0}
/* ---- reels ---- */
function spinReel(i,fin,delay,dur,ant){return new Promise(res=>{
 const r=reels[i],s=r.firstChild,list=[...fin,...Array.from({length:10+i*3+(ant?8:0)},()=>pick(i)),...grid[i]];let done=false;
 s.style.transition='none';s.innerHTML=cellsHTML(list);s.style.transform=`translateY(-${(list.length-3)/list.length*100}%)`;
 const end=()=>{if(done)return;done=true;r.classList.remove('spin','ant');s.style.transition='none';s.innerHTML=cellsHTML(fin);s.style.transform='';snd(140,.14,'triangle',.25,0,60);res()};
 r.fin=()=>{if(done)return;s.style.transition='transform .16s ease-out';s.style.transform='translateY(0)';setTimeout(end,170)};
 setTimeout(()=>{if(slam)return r.fin();r.classList.add('spin');if(ant)r.classList.add('ant');void s.offsetWidth;
  s.style.transition=`transform ${dur}ms cubic-bezier(.25,.8,.35,1.04)`;s.style.transform='translateY(0)';setTimeout(end,dur+60)},delay)})}
const cell=(c,r)=>reels[c].firstChild.children[r];
function clearWin(){clearInterval(cyc);drawL([]);reels.forEach(r=>[...r.firstChild.children].forEach(e=>e.classList.remove('hit','dim')))}
function hl(ws){reels.forEach(r=>[...r.firstChild.children].forEach(e=>{e.classList.remove('hit');e.classList.add('dim')}));ws.forEach(x=>x.cells.forEach(([c,r])=>{const e=cell(c,r);e.classList.remove('dim');e.classList.add('hit')}))}
function evalGrid(g,lb,nl,free,bet){const wins=[];let jp=false;
 LN.slice(0,nl).forEach((ln,li)=>{const cs=ln.map((row,c)=>g[c][row]),b=cs[0];if(b==='scat')return;let n=1;for(let c=1;c<5;c++){if(cs[c]===b||cs[c]==='wild')n++;else break}
  if(n>=3){let p=PAY[b][n-3]*lb;if(b==='drag'&&n===5){p=Math.max(p,st.jp);jp=true}wins.push({li,pay:p,txt:`Line ${li+1}: ${n} × ${NAME[b]} pays ${fmt(p*(free&&!jp?2:1))}`,cells:ln.slice(0,n).map((row,c)=>[c,row])})}});
 const sp=[];g.forEach((col,c)=>col.forEach((k,r)=>k==='scat'&&sp.push([c,r])));
 if(sp.length>=3)wins.push({pay:[0,0,0,2,10,50][Math.min(sp.length,5)]*bet,txt:`${sp.length} × Treasure pays ${fmt([0,0,0,2,10,50][Math.min(sp.length,5)]*bet)}`,cells:sp,scat:true});
 return{wins,jp,sc:sp.length}}
/* ---- treasure vault bonus ---- */
const MTR=12,PZ=[.1,.1,.2,.2,.3,.5,1,2],sleep=ms=>new Promise(r=>setTimeout(r,ms));
const fk=n=>n>=10000?Math.round(n/1000)+'k':n>=1000?(n/1000).toFixed(1)+'k':fmt(n);
const bgEl=document.createElement('div');bgEl.id='bg';$('#win').appendChild(bgEl);
function meter(){$('#mtr').innerHTML=Array.from({length:MTR},(_,i)=>`<i class="pip${i<(st.meter||0)?' on':''}"></i>`).join('')+`<small>${Math.min(st.meter||0,MTR)}/${MTR}</small>`}
async function bonus(bet){
 busy=true;sync();clearWin();bgEl.innerHTML='';
 const L=Array(15).fill(0),cs=[],tot=()=>L.reduce((a,b)=>a+b,0);
 for(let i=0;i<15;i++){const d=document.createElement('div');d.className='bc';bgEl.appendChild(d);cs.push(d)}
 const lock=i=>{L[i]=Math.max(1,Math.round(PZ[Math.random()*PZ.length|0]*bet));cs[i].className='bc lk';cs[i].innerHTML=`<div class="gem">${SYM.gem}</div><b class="pv">${fk(L[i])}</b>`};
 const spinning=i=>{const l=[0,1,2,3].map(()=>cellsHTML([pick(2)])).join('');cs[i].className='bc sp';cs[i].innerHTML=`<div class="rl">${l+l}</div>`};
 jingle(6);coins(40,true);
 await ov(`<div class="bt">TREASURE VAULT</div><p>Locked treasures stay put while the rest spin.<br>Every spin locks more. Fill all 15 for the Grand Treasure.</p>`,'Enter the vault');
 document.body.classList.add('bonus');
 const first=[...Array(15).keys()].sort(()=>Math.random()-.5).slice(0,3);first.forEach(lock);snd(660,.2,'triangle',.15);$('#w').textContent=fmt(tot());
 await sleep(900);
 for(let n=1;n<=8&&L.includes(0);n++){
  const emp=L.map((v,i)=>v?-1:i).filter(i=>i>=0);
  $('#msg').textContent=`Spin ${n} of 8 · ${15-emp.length} of 15 locked`;
  emp.forEach(spinning);snd(300,.5,'sawtooth',.05,0,900);
  await sleep(turbo?450:1100);
  let hit=emp.filter(()=>Math.random()<.12);if(!hit.length)hit=[emp[Math.random()*emp.length|0]];
  for(const i of emp.sort((a,b)=>a%5-b%5||a-b)){await sleep(turbo?40:110);
   if(hit.includes(i)){lock(i);snd(700+L.filter(x=>x).length*40,.18,'triangle',.14);buzz(20)}else{cs[i].className='bc';cs[i].innerHTML='';snd(140,.1,'triangle',.18,0,60)}}
  $('#w').textContent=fmt(tot());await sleep(turbo?300:750)}
 const full=!L.includes(0),n=L.filter(x=>x).length;let t=tot();if(full)t+=50*bet;
 $('#msg').textContent=`${n} of 15 treasures claimed`;
 const pr=ov(`<div class="bt">${full?'GRAND TREASURE':'VAULT CLOSED'}</div><p>${n} of 15 treasures claimed${full?' · matrix complete, +50× bet':''}</p><div class="bn" id="roll">0</div>`,'Collect');
 roll($('#roll'),t,1500,true);jingle(6);coins(full?120:50,true);await pr;
 st.bal+=t;st.meter=0;document.body.classList.remove('bonus');bgEl.innerHTML='';$('#w').textContent=fmt(t);busy=false;sync()}
/* ---- spin ---- */
async function spin(){
 if(busy){slam=true;reels.forEach(r=>r.fin&&r.fin());return}
 await AC?.resume?.();const lb=BETS[st.bi],nl=st.lines,bet=lb*nl,free=fs>0;
 if(free)fs--;else{if(st.bal<bet){auto=false;sync();return refill()}st.bal-=bet;st.jp+=Math.ceil(bet*.03)}
 busy=true;slam=false;clearWin();$('#w').textContent='0';$('#msg').textContent=free?'Free spin…':'Good luck!';sync();snd(300,.25,'sawtooth',.06,0,900);
 const fin=[0,1,2,3,4].map(i=>[pick(i),pick(i),pick(i)]);let sc=0,anyAnt=false;
 await Promise.all(fin.map((f,i)=>{const ant=!turbo&&sc>=2&&i>=2;anyAnt=anyAnt||ant;sc+=f.filter(k=>k==='scat').length;
  return spinReel(i,f,i*(turbo?40:110),(turbo?420:850)+i*(turbo?90:240)+(ant?(i-1)*500:0),ant)}));
 grid=fin;const ev=evalGrid(fin,lb,nl,free,bet);let tot=0,trig=false;
 ev.wins.forEach(w=>{tot+=w.pay;if(w.scat)trig=true});if(free)tot*=2;if(ev.jp){tot=ev.wins.reduce((a,w)=>a+w.pay,0);st.jp=JP0}
 st.bal+=tot;if(free)fsWin+=tot;st.meter=(st.meter||0)+ev.sc;
 busy=false;sync();
 let big=false;
 if(tot>0){const ratio=tot/bet,tier=ev.jp?"DRAGON'S HOARD":ratio>=40?'LEGENDARY WIN':ratio>=15?'EPIC WIN':ratio>=6?'HEROIC WIN':'';
  roll($('#w'),tot,tier?1800:700,true);jingle(tier?6:ratio>=2?4:2);buzz(tier?[60,40,60,40,120]:30);coins(tier?90:14,!!tier);
  hl(ev.wins);drawL(ev.wins.map(w=>w.li));let k=0;const show=()=>{const w=ev.wins[k%ev.wins.length];hl([w]);drawL([w.li]);$('#msg').textContent=w.txt;k++};
  if(ev.wins.length>1)setTimeout(()=>{show();cyc=setInterval(show,1300)},900);else{$('#msg').textContent=ev.wins[0].txt}
  if(tier){big=true;const pr=ov(`<div class="bt">${tier}</div><div class="bn" id="roll">0</div>`,'',ev.jp?5200:3600);roll($('#roll'),tot,1800,true);await pr}
 }
 else $('#msg').textContent=ev.sc?`Treasure +${ev.sc} · ${Math.min(st.meter,MTR)}/${MTR} collected`:'No win. Spin again!';
 if((st.meter||0)>=MTR){await bonus(bet)}
 sync();
 if(fs>0)setTimeout(spin,big?600:1300);
 else{if(free&&fsWin>0){const w=fsWin;fsWin=0;await ov(`<div class="bt">FEATURE OVER</div><p>Free spins paid</p><div class="bn">${fmt(w)}</div>`,'Collect')}
  if(auto&&!big&&st.bal>=bet)setTimeout(spin,turbo?500:900);else if(auto){auto=false;sync()}}
}
async function refill(){await ov(`<div class="bt">OUT OF COINS</div><p>The wizard grants you 5,000 play-money coins.</p>`,'Refill');st.bal+=5000;sync()}
async function daily(){const d=new Date().toDateString();if(st.last===d)return;const y=new Date(Date.now()-864e5).toDateString();st.streak=st.last===y?st.streak+1:1;st.last=d;const a=1000*Math.min(st.streak,7);
 await ov(`<div class="bt">DAILY BONUS</div><p>Day ${st.streak} streak</p><div class="bn">+${fmt(a)}</div>`,'Claim');st.bal+=a;coins(40,true);jingle(5);sync()}
/* ---- wiring ---- */
$('#spin').onclick=spin;
$('#auto').onclick=()=>{auto=!auto;sync();if(auto&&!busy)spin()};
$('#turbo').onclick=()=>{turbo=!turbo;sync()};
$('#snd').onclick=()=>{mute=!mute;sync()};
const flash=()=>drawL(allL(),1000);
$('#lp').onclick=()=>{if(busy)return;const i=LINES.indexOf(st.lines);if(i<LINES.length-1){st.lines=LINES[i+1];snd(700,.05,'square',.05);sync();flash()}};
$('#lm').onclick=()=>{if(busy)return;const i=LINES.indexOf(st.lines);if(i>0){st.lines=LINES[i-1];snd(500,.05,'square',.05);sync();flash()}};
$('#bp').onclick=()=>{if(!busy&&st.bi<BETS.length-1){st.bi++;snd(700,.05,'square',.05);sync()}};
$('#bm').onclick=()=>{if(!busy&&st.bi>0){st.bi--;snd(500,.05,'square',.05);sync()}};
$('#max').onclick=()=>{if(!busy){st.bi=BETS.length-1;st.lines=20;snd(900,.1,'square',.06);sync();flash()}};
$('#show').onclick=()=>{if(!busy)drawL(allL(),1800)};
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();spin()}});
setInterval(()=>{if(!busy){st.jp+=Math.ceil(Math.random()*3);$('#jp').textContent=fmt(st.jp)}},1500);
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
if(!LINES.includes(st.lines))st.lines=10;sync();foot();daily();
</script></body></html>
